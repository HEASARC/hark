name: Release Build and Publish

on:
  release:
    types: [created] # This workflow runs when a new release is published

jobs:
  build_and_upload:
    name: Build for ${{ matrix.target_os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target_os: linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            arch: amd64
            bin_name: hark # Binary name inside the archive
            archive_format: tar.gz
          - target_os: macos
            os: macos-latest # GitHub's x86_64 macOS runner
            target: x86_64-apple-darwin
            arch: amd64
            bin_name: hark
            archive_format: tar.gz
          - target_os: macos
            os: macos-latest # Rust can cross-compile to aarch64 from x86_64 macOS
            target: aarch64-apple-darwin
            arch: arm64
            bin_name: hark
            archive_format: tar.gz

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          override: true
          profile: minimal # Use minimal profile for faster toolchain setup

      - name: Build binary
        run: |
          cargo build --verbose --release --target ${{ matrix.target }}
          ls -lh target/${{ matrix.target }}/release/${{ matrix.bin_name }}
        env:
          CARGO_TERM_COLOR: always # Ensure colored output in logs

      - name: Prepare asset details
        id: asset_prep
        shell: bash # Use bash for consistent string manipulation
        run: |
          PROJECT_NAME="hark"
          VERSION_TAG="${{ github.event.release.tag_name }}"
          # Remove 'v' prefix from tag if present (e.g., v0.1.0 -> 0.1.0)
          VERSION=${VERSION_TAG#v}

          ASSET_BASENAME="${PROJECT_NAME}-${VERSION}-${{ matrix.target_os }}-${{ matrix.arch }}"
          # This is the path to the compiled binary relative to GITHUB_WORKSPACE
          SOURCE_BINARY_PATH="target/${{ matrix.target }}/release/${{ matrix.bin_name }}"

          if [ "${{ matrix.archive_format }}" == "zip" ]; then
            FINAL_ASSET_NAME="${ASSET_BASENAME}}.zip"
            ASSET_CONTENT_TYPE="application/zip"
          elif [ "${{ matrix.archive_format }}" == "tar.gz" ]; then
            FINAL_ASSET_NAME="${ASSET_BASENAME}}.tar.gz"
            ASSET_CONTENT_TYPE="application/gzip"
          fi

          echo "FINAL_ASSET_NAME=${FINAL_ASSET_NAME}" >> $GITHUB_OUTPUT
          echo "SOURCE_BINARY_PATH=${SOURCE_BINARY_PATH}" >> $GITHUB_OUTPUT
          echo "ARCHIVE_INTERNAL_BIN_NAME=${{ matrix.bin_name }}" >> $GITHUB_OUTPUT
          echo "ASSET_CONTENT_TYPE=${ASSET_CONTENT_TYPE}" >> $GITHUB_OUTPUT

      - name: Archive binary (Unix-like Linux/macOS)
        shell: bash
        run: |
          tar czvf "${{ steps.asset_prep.outputs.FINAL_ASSET_NAME }}" -C "$(dirname "${{ steps.asset_prep.outputs.SOURCE_BINARY_PATH }}")" "${{ steps.asset_prep.outputs.ARCHIVE_INTERNAL_BIN_NAME }}"

      - name: Upload Release Asset with gh CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Provided by GitHub Actions
          # GH_REPO: ${{ github.repository }} # gh CLI usually infers this correctly
        run: |
          gh release upload ${{ github.event.release.tag_name }} ./${{ steps.asset_prep.outputs.FINAL_ASSET_NAME }} --clobber