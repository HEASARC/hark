[package]
name = "hark"
version = "0.1.250811"
edition = "2024"

[dependencies]
anyhow = "1.0.98"
rusqlite = { version = "0.36.0", features = ["bundled"] }
rustyline = { version = "16.0.0", features = ["with-file-history"] }
tempfile = "3.20.0"
colored = "3.0.0"
chrono = "0.4.41"
flate2 = "1.1.2"
aws-config = { version = "1.6.3", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1.91.0"
tokio = { version = "1.45.1", features = ["full"] }
self_update = { version = "0.42.0", features = ["archive-tar", "compression-flate2"] }

# Target-specific configurations for musl builds
[target.x86_64-unknown-linux-musl.dependencies]
openssl = { version = "0.10", features = ["vendored"] }

